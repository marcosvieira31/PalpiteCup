name: Sync Scores

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          curl -f -s -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
          https://palpite-cup.vercel.app/api/cron/sync-scores

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Cron de Sincronização Falhou!',
              body: `O workflow automático de atualização dos jogos falhou.\n\nVerifique os logs detalhados: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
